apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-app
  template:
    metadata:
      labels:
        app: simple-app
    spec:
      containers:
        - name: simple-app
          image: simple-app:latest
          env:
            - name: DATABASE_URL
              value: "postgresql://user:pass@localhost/mydb"
            - name: SECRET_KEY
              value: "your-secret-key"
