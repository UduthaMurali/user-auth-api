name: Config Drift Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  drift:
    name: "Detect Config Drift"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user-auth-api
        uses: actions/checkout@v4

      - name: Checkout config-drift-detector
        uses: actions/checkout@v4
        with:
          repository: UduthaMurali/config-drift-detector
          path: drift-tool

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install drift detector
        run: pip install -r drift-tool/requirements.txt

      - name: Run Config Drift Detector
        run: |
          python drift-tool/main.py \
            --source . \
            --config Dockerfile,docker-compose.yml,k8s/deployment.yaml,.env.example \
            --languages python \
            --fail-on-drift
